name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Versioning & Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GH App token
        id: generate-token
        uses: ./.github/workflows/generate-gh-app-token
        with:
          app-id: ${{ secrets.WAYFEA_APP_ID }}
          private-key: ${{ secrets.WAYFEA_PRIVATE_KEY }}

      - name: Run release-please-action
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}

          config-file: .github/configs/release-please-config.json
          manifest-file: .github/configs/.release-please-manifest.json