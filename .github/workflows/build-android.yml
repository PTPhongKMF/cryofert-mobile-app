name: CD (android)

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install dependencies
        run: pnpm install @ionic/cli; pnpm install

      - name: Sync Capacitor Android project
        run: pnpm run sync

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK to cryofert-android-debug.apk
        run: |
          set -euo pipefail
          out_dir="android/app/build/outputs/apk/debug"
          echo "Looking for APKs in $out_dir"
          apk="$(ls -t $out_dir/*.apk 2>/dev/null | head -n1 || true)"
          if [ -z "$apk" ]; then
            echo "No APK found in $out_dir" >&2
            exit 1
          fi
          echo "Found APK: $apk"
          mv -- "$apk" "$out_dir/cryofert-android-debug.apk"
          echo "Renamed to $out_dir/cryofert-android-debug.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/cryofert-android-debug.apk
